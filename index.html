<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Minha Namorada</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6f2;
            text-align: center;
            padding: 20px;
        }
        .mensagem {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #d63384;
        }
        .surpresa {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #d63384;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Feliz Aniversário, Meu Amor! 💖</h1>
    <div class="mensagem">
        <p>Você é a pessoa mais especial do mundo para mim. Espero que este pequeno presente te faça sorrir! 🥰</p>
    </div>
    <button class="surpresa" onclick="mostrarMensagem()">Clique aqui para uma surpresa!</button>
    <div class="mensagem" id="surpresa" style="display: none;">
        <p>Te amo mais do que palavras podem expressar!❤️</p>
    </div>

    <script>
        function mostrarMensagem() {
            document.getElementById('surpresa').style.display = 'block';
        }
    </script>
</body>
</html>
